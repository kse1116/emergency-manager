<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>긴급대책AI</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Noto Sans KR",
        sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      padding-bottom: 76px;
    }

    .header {
      background: #ffffff;
      padding: 18px 18px 14px;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title {
      font-size: 22px;
      font-weight: 800;
    }

    .user-name {
      font-size: 13px;
      color: #6b7280;
      margin-top: 3px;
    }

    .refresh-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #f3f4f6;
      font-size: 20px;
    }

    .content {
      padding: 16px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .welcome {
      background: #111827;
      color: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .welcome-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .welcome-text {
      font-size: 13px;
      opacity: 0.8;
      line-height: 1.5;
    }

    .section-title {
      font-size: 17px;
      font-weight: 800;
      margin: 20px 0 10px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .menu-card {
      background: white;
      border-radius: 16px;
      padding: 18px 14px;
      text-align: left;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .menu-card:active {
      transform: scale(0.98);
    }

    .menu-icon {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .menu-title {
      font-weight: 800;
      font-size: 15px;
    }

    .menu-desc {
      color: #6b7280;
      font-size: 12px;
      margin-top: 4px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item {
      background: white;
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .item-main {
      font-weight: 700;
      font-size: 15px;
      line-height: 1.45;
    }

    .item-meta {
      color: #6b7280;
      font-size: 12px;
      margin-top: 7px;
      line-height: 1.5;
    }

    .item-actions {
      display: flex;
      gap: 7px;
      margin-top: 11px;
    }

    .small-btn {
      padding: 8px 12px;
      border-radius: 9px;
      background: #f3f4f6;
      color: #374151;
      font-size: 12px;
      font-weight: 700;
    }

    .small-btn.delete {
      background: #fee2e2;
      color: #b91c1c;
    }

    .primary-btn {
      width: 100%;
      padding: 14px;
      border-radius: 13px;
      background: #111827;
      color: white;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .secondary-btn {
      width: 100%;
      padding: 13px;
      border-radius: 13px;
      background: white;
      color: #111827;
      font-weight: 700;
      border: 1px solid #e5e7eb;
    }

    .form {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 15px;
    }

    .form-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 13px;
    }

    .field {
      margin-bottom: 11px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #4b5563;
      margin-bottom: 5px;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 11px;
      background: white;
      outline: none;
    }

    .field textarea {
      min-height: 100px;
      resize: vertical;
    }

    .empty {
      background: white;
      border-radius: 15px;
      padding: 30px 16px;
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
    }

    .news-card {
      background: white;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 10px;
    }

    .news-title {
      font-weight: 800;
      font-size: 14px;
      line-height: 1.5;
    }

    .news-meta {
      color: #9ca3af;
      font-size: 11px;
      margin-top: 7px;
    }

    .ai-answer {
      white-space: pre-wrap;
      background: white;
      border-radius: 15px;
      padding: 16px;
      line-height: 1.65;
      font-size: 14px;
      margin-top: 12px;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 68px;
      background: rgba(255,255,255,0.97);
      border-top: 1px solid #e5e7eb;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      z-index: 50;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .nav-btn {
      background: transparent;
      color: #9ca3af;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .nav-btn.active {
      color: #111827;
      font-weight: 800;
    }

    .nav-icon {
      font-size: 20px;
    }

    .loading {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .loading.show {
      display: flex;
    }

    .loading-box {
      background: #111827;
      color: white;
      padding: 18px 22px;
      border-radius: 14px;
      font-size: 14px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: flex-end;
      z-index: 80;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      background: white;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 22px 22px 0 0;
      padding: 20px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
    }

    .close-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #f3f4f6;
      font-size: 18px;
    }

    .notice {
      background: #fff7ed;
      color: #9a3412;
      border-radius: 12px;
      padding: 12px;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

<div id="loading" class="loading">
  <div class="loading-box">처리 중입니다...</div>
</div>

<div id="outsideTelegram" class="hidden">
  <div style="padding:40px 20px;text-align:center;">
    <div style="font-size:50px;margin-bottom:15px;">🤖</div>
    <h2>긴급대책AI</h2>
    <p style="color:#6b7280;line-height:1.6;">
      Telegram 앱 안에서<br>
      긴급대책AI 메뉴 버튼으로 열어주세요.
    </p>
  </div>
</div>

<div id="app" class="app hidden">

  <header class="header">
    <div class="header-row">
      <div>
        <div class="title">긴급대책AI</div>
        <div id="userName" class="user-name">로그인 확인 중...</div>
      </div>
      <button class="refresh-btn" onclick="refreshCurrent()">↻</button>
    </div>
  </header>

  <main class="content">

    <!-- 홈 -->
    <section id="page-home" class="page active">

      <div class="welcome">
        <div class="welcome-title">긴급대책AI</div>
        <div class="welcome-text">
          일정, 정산, 메모를 한 곳에서 관리하세요.
        </div>
      </div>

      <div class="card-grid">

        <button class="menu-card" onclick="showPage('schedule')">
          <div class="menu-icon">📅</div>
          <div class="menu-title">일정</div>
          <div class="menu-desc">일정 등록·수정·삭제</div>
        </button>

        <button class="menu-card" onclick="showPage('settlement')">
          <div class="menu-icon">💰</div>
          <div class="menu-title">정산</div>
          <div class="menu-desc">비용과 지출 관리</div>
        </button>

        <button class="menu-card" onclick="showPage('memo')">
          <div class="menu-icon">📝</div>
          <div class="menu-title">메모</div>
          <div class="menu-desc">공유 메모 관리</div>
        </button>

        <button class="menu-card" onclick="showNews()">
          <div class="menu-icon">📰</div>
          <div class="menu-title">뉴스</div>
          <div class="menu-desc">오늘의 주요 뉴스</div>
        </button>

      </div>

      <div class="section-title">AI에게 물어보기</div>

      <button class="primary-btn" onclick="showPage('ai')">
        🤖 긴급대책AI에게 질문
      </button>

      <div class="section-title">오늘의 일정</div>
      <div id="homeSchedules"></div>

    </section>


    <!-- 일정 -->
    <section id="page-schedule" class="page">

      <div class="section-title">일정 관리</div>

      <div class="form">
        <div class="form-title">일정 등록</div>

        <div class="field">
          <label>날짜</label>
          <input id="scheduleDate" type="date">
        </div>

        <div class="field">
          <label>시간</label>
          <input id="scheduleTime" type="time">
        </div>

        <div class="field">
          <label>일정</label>
          <input id="scheduleTitle" placeholder="예: 회의">
        </div>

        <button class="primary-btn" onclick="addSchedule()">
          일정 등록
        </button>
      </div>

      <div id="scheduleList" class="list"></div>

    </section>


    <!-- 정산 -->
    <section id="page-settlement" class="page">

      <div class="section-title">정산 관리</div>

      <div class="form">
        <div class="form-title">정산 등록</div>

        <div class="field">
          <label>날짜</label>
          <input id="settlementDate" type="date">
        </div>

        <div class="field">
          <label>내용</label>
          <input id="settlementContent" placeholder="예: 식비">
        </div>

        <div class="field">
          <label>금액</label>
          <input id="settlementAmount" type="number" placeholder="예: 35000">
        </div>

        <div class="field">
          <label>비고</label>
          <input id="settlementNote" placeholder="선택사항">
        </div>

        <button class="primary-btn" onclick="addSettlement()">
          정산 등록
        </button>
      </div>

      <div id="settlementList" class="list"></div>

    </section>


    <!-- 메모 -->
    <section id="page-memo" class="page">

      <div class="section-title">공유 메모</div>

      <div class="form">
        <div class="form-title">메모 등록</div>

        <div class="field">
          <label>날짜</label>
          <input id="memoDate" type="date">
        </div>

        <div class="field">
          <label>메모</label>
          <textarea id="memoText" placeholder="공유할 내용을 입력하세요"></textarea>
        </div>

        <div class="field">
          <label>비고</label>
          <input id="memoNote" placeholder="선택사항">
        </div>

        <button class="primary-btn" onclick="addMemo()">
          메모 등록
        </button>
      </div>

      <div id="memoList" class="list"></div>

    </section>


    <!-- 뉴스 -->
    <section id="page-news" class="page">

      <div class="section-title">오늘의 뉴스</div>

      <button class="primary-btn" onclick="loadNews()">
        📰 최신 뉴스 불러오기
      </button>

      <div id="newsList"></div>

    </section>


    <!-- AI -->
    <section id="page-ai" class="page">

      <div class="section-title">긴급대책AI</div>

      <div class="notice">
        일정, 정산, 뉴스, 상황 판단 등에 대해 자유롭게 질문하세요.
      </div>

      <div class="form">

        <div class="field">
          <label>질문</label>
          <textarea
            id="aiQuestion"
            placeholder="예: 오늘 일정과 관련해서 주의할 점을 정리해줘."
          ></textarea>
        </div>

        <button class="primary-btn" onclick="askAI()">
          🤖 AI에게 질문
        </button>

      </div>

      <div id="aiAnswer"></div>

    </section>

  </main>


  <!-- 하단 메뉴 -->
  <nav class="bottom-nav">

    <button id="nav-home" class="nav-btn active" onclick="showPage('home')">
      <span class="nav-icon">🏠</span>
      홈
    </button>

    <button id="nav-schedule" class="nav-btn" onclick="showPage('schedule')">
      <span class="nav-icon">📅</span>
      일정
    </button>

    <button id="nav-settlement" class="nav-btn" onclick="showPage('settlement')">
      <span class="nav-icon">💰</span>
      정산
    </button>

    <button id="nav-memo" class="nav-btn" onclick="showPage('memo')">
      <span class="nav-icon">📝</span>
      메모
    </button>

    <button id="nav-ai" class="nav-btn" onclick="showPage('ai')">
      <span class="nav-icon">🤖</span>
      AI
    </button>

  </nav>

</div>


<!-- 수정 모달 -->
<div id="editModal" class="modal">

  <div class="modal-box">

    <div class="modal-header">
      <div id="modalTitle" class="modal-title">수정</div>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>

    <div id="modalFields"></div>

    <button class="primary-btn" onclick="saveEdit()">
      저장
    </button>

    <button class="secondary-btn" onclick="closeModal()">
      취소
    </button>

  </div>

</div>


<script>

  /*
   * ============================================================
   * 긴급대책AI Mini App
   * ============================================================
   */

  const API_URL =
    "https://script.google.com/macros/s/AKfycby3OEfk0jjKccfdviqgePbcPSIdiWOX8ezss7g9KN52KxWoWosdRgmNUc8fL1r4y9ko/exec";


  let tg = null;
  let initData = "";

  let schedules = [];
  let settlements = [];
  let memos = [];

  let currentPage = "home";

  let editType = "";
  let editRow = null;
  let editData = null;


  /*
   * Telegram 초기화
   */

  function initTelegram() {

    if (
      !window.Telegram ||
      !window.Telegram.WebApp
    ) {
      document
        .getElementById("outsideTelegram")
        .classList.remove("hidden");

      return false;
    }

    tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    initData = tg.initData || "";

    if (!initData) {

      document
        .getElementById("outsideTelegram")
        .classList.remove("hidden");

      return false;
    }

    document
      .getElementById("app")
      .classList.remove("hidden");

    const user =
      tg.initDataUnsafe &&
      tg.initDataUnsafe.user
        ? tg.initDataUnsafe.user
        : null;

    if (user) {

      let name = "";

      if (user.first_name) {
        name += user.first_name;
      }

      if (user.last_name) {
        name += " " + user.last_name;
      }

      if (user.username) {
        name += " @" + user.username;
      }

      document.getElementById("userName").textContent =
        name || "Telegram 사용자";

    } else {

      document.getElementById("userName").textContent =
        "Telegram 사용자";

    }

    return true;
  }


  /*
   * JSONP API
   */

  function api(action, params = {}) {

    return new Promise(function(resolve, reject) {

      if (!initData) {
        reject(
          new Error(
            "Telegram 인증 정보가 없습니다."
          )
        );
        return;
      }

      const callbackName =
        "__miniAppCallback_" +
        Date.now() +
        "_" +
        Math.floor(Math.random() * 100000);

      const script =
        document.createElement("script");

      const query = [];

      query.push(
        "action=" +
        encodeURIComponent(action)
      );

      query.push(
        "initData=" +
        encodeURIComponent(initData)
      );

      query.push(
        "callback=" +
        encodeURIComponent(callbackName)
      );

      query.push(
        "ts=" +
        Date.now()
      );

      Object.keys(params).forEach(function(key) {

        const value =
          params[key] === undefined ||
          params[key] === null
            ? ""
            : params[key];

        query.push(
          encodeURIComponent(key) +
          "=" +
          encodeURIComponent(value)
        );

      });

      const url =
        API_URL +
        "?" +
        query.join("&");

      let finished = false;

      const timer =
        setTimeout(function() {

          if (finished) return;

          finished = true;

          cleanup();

          reject(
            new Error(
              "서버 응답 시간이 초과되었습니다."
            )
          );

        }, 20000);


      function cleanup() {

        clearTimeout(timer);

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

        try {
          delete window[callbackName];
        } catch (e) {
          window[callbackName] = undefined;
        }

      }


      window[callbackName] =
        function(result) {

          if (finished) return;

          finished = true;

          cleanup();

          if (
            result &&
            result.ok === false
          ) {

            reject(
              new Error(
                result.error ||
                "서버 오류가 발생했습니다."
              )
            );

            return;
          }

          resolve(result);

        };


      script.onerror =
        function() {

          if (finished) return;

          finished = true;

          cleanup();

          reject(
            new Error(
              "API 서버에 연결할 수 없습니다."
            )
          );

        };


      script.src = url;

      document
        .head
        .appendChild(script);

    });

  }


  /*
   * 로딩
   */

  function showLoading(show) {

    const el =
      document.getElementById("loading");

    if (show) {
      el.classList.add("show");
    } else {
      el.classList.remove("show");
    }

  }


  /*
   * 페이지 전환
   */

  function showPage(page) {

    currentPage = page;

    document
      .querySelectorAll(".page")
      .forEach(function(el) {

        el.classList.remove("active");

      });

    const target =
      document.getElementById(
        "page-" + page
      );

    if (target) {
      target.classList.add("active");
    }


    document
      .querySelectorAll(".nav-btn")
      .forEach(function(el) {

        el.classList.remove("active");

      });

    const nav =
      document.getElementById(
        "nav-" + page
      );

    if (nav) {
      nav.classList.add("active");
    }


    if (page === "home") {
      loadHome();
    }

    if (page === "schedule") {
      loadSchedules();
    }

    if (page === "settlement") {
      loadSettlements();
    }

    if (page === "memo") {
      loadMemos();
    }

    if (page === "news") {
      loadNews();
    }

  }


  function refreshCurrent() {

    if (currentPage === "home") {
      loadHome();
    }

    if (currentPage === "schedule") {
      loadSchedules();
    }

    if (currentPage === "settlement") {
      loadSettlements();
    }

    if (currentPage === "memo") {
      loadMemos();
    }

    if (currentPage === "news") {
      loadNews();
    }

  }


  /*
   * 날짜
   */

  function today() {

    const d = new Date();

    const y =
      d.getFullYear();

    const m =
      String(d.getMonth() + 1)
        .padStart(2, "0");

    const day =
      String(d.getDate())
        .padStart(2, "0");

    return y + "-" + m + "-" + day;

  }


  /*
   * HTML escape
   */

  function escapeHtml(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /*
   * 홈
   */

  async function loadHome() {

    try {

      const result =
        await api("getSchedules");

      schedules =
        result.schedules || [];

      renderHomeSchedules();

    } catch (error) {

      document
        .getElementById("homeSchedules")
        .innerHTML =
        '<div class="empty">' +
        escapeHtml(error.message) +
        '</div>';

    }

  /*
   * 수정
   */

  function openEdit(type, row) {

    let data = null;

    if (type === "schedule") {

      data =
        schedules.find(function(item) {
          return Number(item.row) === Number(row);
        });

    }

    if (type === "settlement") {

      data =
        settlements.find(function(item) {
          return Number(item.row) === Number(row);
        });

    }

    if (type === "memo") {

      data =
        memos.find(function(item) {
          return Number(item.row) === Number(row);
        });

    }


    if (!data) {

      alert(
        "수정할 데이터를 찾을 수 없습니다."
      );

      return;
    }


    editType = type;
    editRow = row;
    editData = data;


    const fields =
      document.getElementById(
        "modalFields"
      );


    if (type === "schedule") {

      document.getElementById(
        "modalTitle"
      ).textContent = "일정 수정";

      fields.innerHTML = `

        <div class="field">
          <label>날짜</label>
          <input
            id="editDate"
            type="date"
            value="${escapeHtml(data.date || "")}">
        </div>

        <div class="field">
          <label>시간</label>
          <input
            id="editTime"
            type="time"
            value="${escapeHtml(data.time || "")}">
        </div>

        <div class="field">
          <label>일정</label>
          <input
            id="editTitle"
            value="${escapeHtml(data.title || data.schedule || "")}">
        </div>

      `;

    }


    if (type === "settlement") {

      document.getElementById(
        "modalTitle"
      ).textContent = "정산 수정";

      fields.innerHTML = `

        <div class="field">
          <label>날짜</label>
          <input
            id="editDate"
            type="date"
            value="${escapeHtml(data.date || "")}">
        </div>

        <div class="field">
          <label>내용</label>
          <input
            id="editContent"
            value="${escapeHtml(data.content || "")}">
        </div>

        <div class="field">
          <label>금액</label>
          <input
            id="editAmount"
            type="number"
            value="${escapeHtml(data.amount || "")}">
        </div>

        <div class="field">
          <label>비고</label>
          <input
            id="editNote"
            value="${escapeHtml(data.note || "")}">
        </div>

      `;

    }


    if (type === "memo") {

      document.getElementById(
        "modalTitle"
      ).textContent = "메모 수정";

      fields.innerHTML = `

        <div class="field">
          <label>날짜</label>
          <input
            id="editDate"
            type="date"
            value="${escapeHtml(data.date || "")}">
        </div>

        <div class="field">
          <label>메모</label>
          <textarea id="editMemo">${escapeHtml(data.memo || "")}</textarea>
        </div>

        <div class="field">
          <label>비고</label>
          <input
            id="editNote"
            value="${escapeHtml(data.note || "")}">
        </div>

      `;

    }


    document
      .getElementById("editModal")
      .classList.add("show");

  }


  function closeModal() {

    document
      .getElementById("editModal")
      .classList.remove("show");

    editType = "";
    editRow = null;
    editData = null;

  }


  async function saveEdit() {

    if (!editType || editRow === null) {
      return;
    }

    showLoading(true);

    try {

      if (editType === "schedule") {

        const date =
          document.getElementById(
            "editDate"
          ).value;

        const time =
          document.getElementById(
            "editTime"
          ).value;

        const title =
          document.getElementById(
            "editTitle"
          ).value.trim();


        if (!date || !title) {
          throw new Error(
            "날짜와 일정을 입력해주세요."
          );
        }


        await api(
          "updateSchedule",
          {
            row: editRow,
            date: date,
            time: time,
            title: title
          }
        );


        closeModal();

        await loadSchedules();

      }


      if (editType === "settlement") {

        const date =
          document.getElementById(
            "editDate"
          ).value;

        const content =
          document.getElementById(
            "editContent"
          ).value.trim();

        const amount =
          document.getElementById(
            "editAmount"
          ).value;

        const note =
          document.getElementById(
            "editNote"
          ).value.trim();


        if (!date || !content || !amount) {
          throw new Error(
            "날짜, 내용, 금액을 입력해주세요."
          );
        }


        await api(
          "updateSettlement",
          {
            row: editRow,
            date: date,
            content: content,
            amount: amount,
            note: note
          }
        );


        closeModal();

        await loadSettlements();

      }


      if (editType === "memo") {

        const date =
          document.getElementById(
            "editDate"
          ).value;

        const memo =
          document.getElementById(
            "editMemo"
          ).value.trim();

        const note =
          document.getElementById(
            "editNote"
          ).value.trim();


        if (!date || !memo) {
          throw new Error(
            "날짜와 메모를 입력해주세요."
          );
        }


        await api(
          "updateMemo",
          {
            row: editRow,
            date: date,
            memo: memo,
            note: note
          }
        );


        closeModal();

        await loadMemos();

      }


    } catch (error) {

      alert(error.message);

    } finally {

      showLoading(false);

    }

  }


  /*
   * 뉴스
   */

  function showNews() {

    showPage("news");

  }


  async function loadNews() {

    const box =
      document.getElementById(
        "newsList"
      );

    box.innerHTML =
      '<div class="empty">뉴스를 불러오는 중...</div>';

    showLoading(true);

    try {

      const result =
        await api("getNews");

      const items =
        result.items ||
        result.news ||
        [];


      if (!items.length) {

        box.innerHTML =
          '<div class="empty">뉴스가 없습니다.</div>';

        return;
      }


      box.innerHTML =
        items.map(function(item) {

          const title =
            item.title ||
            item.name ||
            "";

          const date =
            item.pubDate ||
            item.date ||
            "";


          let link = item.link || "#";


          return `
            <div
              class="news-card"
              onclick="openNews('${escapeHtml(link)}')">

              <div class="news-title">
                ${escapeHtml(title)}
              </div>

              <div class="news-meta">
                ${escapeHtml(date)}
              </div>

            </div>
          `;

        }).join("");


    } catch (error) {

      box.innerHTML =
        '<div class="empty">' +
        escapeHtml(error.message) +
        '</div>';

    } finally {

      showLoading(false);

    }

  }


  function openNews(url) {

    if (!url || url === "#") {
      return;
    }

    if (tg && tg.openLink) {
      tg.openLink(url);
    } else {
      window.open(url, "_blank");
    }

  }


  /*
   * AI
   */

  async function askAI() {

    const question =
      document.getElementById(
        "aiQuestion"
      ).value.trim();


    if (!question) {

      alert(
        "질문을 입력해주세요."

    showLoading(true);


    try {

      const result =
        await api(

    } catch (error) {

        "aiAnswer"
      ).innerHTML =
        '<div class="ai-answer">' +
        escapeHtml(error.message) +
        '</div>';

    } finally {

    }

  }


  /*
   * 초기값
   */

  function setDefaultDates() {

    const t = today();

    const scheduleDate =
      document.getElementById(
        "scheduleDate"
      );

    const settlementDate =
      document.getElementById(
        "settlementDate"
      );

    const memoDate =
      document.getElementById(
        "memoDate"
      );


    if (scheduleDate) {
      scheduleDate.value = t;
    }

    if (settlementDate) {
      settlementDate.value = t;
    }

    if (memoDate) {
      memoDate.value = t;
    }

  }

  document.addEventListener(
    "DOMContentLoaded",
    async function() {

      const ok =
        initTelegram();

      if (!ok) {
        return;
      }

      setDefaultDates();

      await loadHome();

    }
